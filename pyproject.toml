[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-recruitment-assistant"
version = "0.1.0"
description = "JD (Phase 1) + resume (Phase 2) + weighted scoring (Phase 2.5) + HR screening + interview questions (Phase 3A) + interview evaluation (Phase 3B), as a Microsoft Agent Framework workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.9,<3", "PyYAML>=6.0", "python-dotenv>=1.0", "openai>=1.40",
  "pymupdf>=1.24", "python-docx>=1.1", "rapidfuzz>=3.0", "rich>=13.0", "pytesseract>=0.3.10", "pillow>=10.0", "groq>=0.9", "requests>=2.31",
  "streamlit>=1.38", "pandas>=2.0", "agent-framework>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]   # only for the optional Phase 3A HTTP API

[tool.setuptools.packages.find]
where = ["src"]
