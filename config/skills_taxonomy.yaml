# ONE taxonomy for ALL roles. One skill per line. Format:
#   id: {name: Display name, category: Language|Framework|Tool|Domain, aliases: [other spellings]}
#
# What belongs here: a NAMED, standard skill (a language, framework, library, tool, platform,
# protocol, standard, or a well-known discipline such as "Machine Learning").
# What does NOT belong: vague phrases like "AI/ML models", "cloud technologies", "databases",
# "frontend skills", "good coding practices". Those stay Unmapped on purpose.
#
# Name and id are matched automatically. List only extra spellings in aliases.
# Spaces, dots, dashes, "/" and "_" are ignored when matching, so "React.js", "react js" and
# "React-JS" all match the alias "reactjs".
# Do not use commas inside a name or alias. Avoid very short aliases that are also normal words.

